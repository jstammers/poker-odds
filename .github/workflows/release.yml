name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14          # Apple Silicon runner
            artifact: poker-odds-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-13          # Intel runner
            artifact: poker-odds-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM module
        run: |
          wasm-pack build --target web --out-dir web/wasm --release -- --features wasm

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      - name: Install Tauri CLI
        working-directory: web
        run: npm install -D @tauri-apps/cli@2

      - name: Build Tauri app
        working-directory: web
        run: npx tauri build --target ${{ matrix.target }}

      - name: Package DMG
        run: |
          mkdir -p dist
          DMG=$(find web/src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' | head -1)
          cp "$DMG" dist/${{ matrix.artifact }}.dmg
          shasum -a 256 dist/${{ matrix.artifact }}.dmg > dist/${{ matrix.artifact }}.dmg.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.dmg
            dist/${{ matrix.artifact }}.dmg.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.sha256
