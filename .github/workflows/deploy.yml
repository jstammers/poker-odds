name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]   # build-check only on PRs (no deploy)

# Allow one concurrent deployment; cancel in-progress runs on new push.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build WASM + Web
    runs-on: ubuntu-latest

    steps:
      # ── Source ────────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Rust toolchain + wasm32 target ────────────────────────────────────────
      - name: Install Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Cache ~/.cargo/registry and the incremental build artifacts.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # ── wasm-pack ─────────────────────────────────────────────────────────────
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # ── Node / npm ────────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install JS dependencies
        run: cd web && npm ci

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build WASM
        run: make wasm

      - name: Build production web bundle
        run: cd web && npm run build
        env:
          # GitHub Pages serves project repos at /repo-name/.
          # Setting this lets Vite use the correct base path for all asset URLs.
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      # ── Upload artifact (deploy step picks it up) ─────────────────────────────
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
