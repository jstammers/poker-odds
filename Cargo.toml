[package]
name = "poker-odds"
version = "0.1.0"
edition = "2021"

[lib]
name = "poker_odds"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "poker-odds"
path = "src/main.rs"

# ── Core deps (all targets) ───────────────────────────────────────────────────
[dependencies]
rand         = "0.9"
rand_xoshiro = "0.7"
itertools    = "0.14"
anyhow       = "1.0"
thiserror    = "2.0"
once_cell    = "1.20"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"

# ── Native-only deps ──────────────────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml             = "0.8"
dirs             = "6.0"
rayon            = "1.10"
crossbeam-channel = "0.5"
ratatui          = "0.29"
crossterm        = "0.28"

# ── WASM-only deps ────────────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen           = "0.2"
console_error_panic_hook = "0.1"
# Overrides the transitive rand → getrandom dep so the browser JS API is used
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "eval_bench"
harness = false

[[bench]]
name = "sim_bench"
harness = false

# ── Release profile ───────────────────────────────────────────────────────────
[profile.release]
opt-level    = 3
lto          = "thin"   # cross-crate inlining without full-LTO compile time cost
codegen-units = 1       # single CGU → better inlining within the crate
strip        = "debuginfo"
