name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build WASM module
        run: wasm-pack build --target bundler --out-dir web/wasm --release

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/wasm/
          retention-days: 7

  build-tauri:
    name: Build universal macOS app
    runs-on: macos-14
    needs: [build-wasm]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/wasm/

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      - name: Build Tauri universal app
        working-directory: web
        run: npx tauri build --target universal-apple-darwin

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          DMG=$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "Error: no DMG file found in target/universal-apple-darwin/release/bundle/dmg"
            exit 1
          fi
          cp "$DMG" dist/poker-odds-macos-universal.dmg
          shasum -a 256 dist/poker-odds-macos-universal.dmg > dist/poker-odds-macos-universal.dmg.sha256

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-tauri]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip-header

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            dist/poker-odds-macos-universal.dmg
            dist/poker-odds-macos-universal.dmg.sha256
