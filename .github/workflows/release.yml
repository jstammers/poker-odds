name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Note: no `branches` filter here — tags are not branches and would not match.
    # The job condition below filters to tag-triggered CI runs instead.

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip-header

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            dist/poker-odds-macos-universal.dmg
            dist/poker-odds-macos-universal.dmg.sha256
