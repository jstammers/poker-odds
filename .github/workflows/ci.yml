name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Stage 1: checks ──────────────────────────────────────────────────────────

  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Clippy + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (native)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check WASM target compiles
        run: cargo check --lib --target wasm32-unknown-unknown

      - name: Unit tests
        run: cargo test --workspace

  # ── Stage 2: build ───────────────────────────────────────────────────────────

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: [fmt, test]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - id: cache-wasm
        uses: actions/cache@v4
        with:
          path: web/wasm
          key: wasm-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**', 'rust-toolchain*') }}

      - name: Install wasm-pack
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build WASM module
        if: steps.cache-wasm.outputs.cache-hit != 'true'
        run: wasm-pack build --target bundler --out-dir web/wasm --release

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/wasm/
          retention-days: 7

  build-web:
    name: Build web bundle
    runs-on: ubuntu-latest
    needs: [build-wasm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/wasm/

      - id: cache-web
        uses: actions/cache@v4
        with:
          path: web/dist
          key: web-${{ hashFiles('web/package-lock.json', 'web/src/**', 'web/index.html', 'web/vite.config.ts', 'web/tsconfig*.json') }}-wasm-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**') }}

      - name: Install JS dependencies
        if: steps.cache-web.outputs.cache-hit != 'true'
        run: cd web && npm ci

      - name: Build web bundle
        if: steps.cache-web.outputs.cache-hit != 'true'
        run: cd web && npm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  build-tauri:
    name: Build Tauri (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [build-wasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-path: target/universal-apple-darwin/release/bundle
            args: --target universal-apple-darwin
          # - name: linux-x86_64
          #   os: ubuntu-22.04
          #   rust-targets: x86_64-unknown-linux-gnu
          #   bundle-path: target/release/bundle
          #   args: ''
          # - name: windows-x86_64
          #   os: windows-latest
          #   rust-targets: x86_64-pc-windows-msvc
          #   bundle-path: target/release/bundle
          #   args: ''
          # - name: ios                        # future: requires tauri ios init + Xcode
          #   os: macos-14
          #   rust-targets: aarch64-apple-ios
          #   bundle-path: target/aarch64-apple-ios/release/bundle
          #   args: ios build --ci
          # - name: android                    # future: requires tauri android init + NDK
          #   os: ubuntu-22.04
          #   rust-targets: aarch64-linux-android
          #   bundle-path: target/aarch64-linux-android/release/bundle
          #   args: android build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: tauri-${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/wasm/

      - id: cache-bundle
        uses: actions/cache@v4
        with:
          path: ${{ matrix.bundle-path }}
          key: tauri-bundle-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**', 'web/src-tauri/**', 'web/package-lock.json', 'web/src/**', 'web/vite.config.ts', 'web/index.html', 'web/tsconfig*.json') }}

      - name: Install JS dependencies
        if: steps.cache-bundle.outputs.cache-hit != 'true'
        run: cd web && npm ci

      - name: Build Tauri bundle
        if: steps.cache-bundle.outputs.cache-hit != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: web
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.name }}
          path: ${{ matrix.bundle-path }}/
          retention-days: 7

  # ── Stage 3: deploy ──────────────────────────────────────────────────────────

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [build-web, build-tauri]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
