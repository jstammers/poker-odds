name: Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Run benchmarks on the base branch (what the PR is merging into) ──────────
  # Each benchmark binary runs in its own parallel matrix job.
  # Results are cached by (binary, base branch HEAD SHA) so they are only
  # re-run when the base branch itself advances.

  bench-base:
    name: Benchmark base (${{ matrix.bench }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bench: [eval_bench, sim_bench, solver_bench]
    steps:
      - name: Restore cached base-branch results
        id: cache-base
        uses: actions/cache@v4
        with:
          path: target/criterion/
          key: bench-base-${{ matrix.bench }}-${{ github.event.pull_request.base.sha }}

      - uses: actions/checkout@v4
        if: steps.cache-base.outputs.cache-hit != 'true'
        with:
          ref: ${{ github.base_ref }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cache-base.outputs.cache-hit != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.cache-base.outputs.cache-hit != 'true'
        with:
          shared-key: bench-base-${{ matrix.bench }}-${{ github.base_ref }}

      - name: Run benchmarks
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: cargo bench --bench ${{ matrix.bench }}

      - name: Upload Criterion results
        uses: actions/upload-artifact@v4
        with:
          name: bench-base-${{ matrix.bench }}
          path: target/criterion/
          retention-days: 1

  # ── Run benchmarks on the PR branch ─────────────────────────────────────────
  # Each benchmark binary runs in its own parallel matrix job.

  bench-pr:
    name: Benchmark PR (${{ matrix.bench }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bench: [eval_bench, sim_bench, solver_bench]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-pr-${{ matrix.bench }}-${{ github.sha }}

      - name: Run benchmarks
        run: cargo bench --bench ${{ matrix.bench }}

      - name: Upload Criterion results
        uses: actions/upload-artifact@v4
        with:
          name: bench-pr-${{ matrix.bench }}
          path: target/criterion/
          retention-days: 1

  # ── Download both sets of results, compare, and report ───────────────────────

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [bench-base, bench-pr]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-base-*
          path: bench-base/
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: bench-pr-*
          path: bench-pr/
          merge-multiple: true

      - name: Generate comparison table
        run: |
          python3 - <<'PYEOF'
          import json, os, glob

          THRESHOLD_PCT = 5  # % change required to flag as improvement or regression

          def load_estimates(root):
              """Return {bench_name: mean_ns} from a Criterion output tree."""
              results = {}
              pattern = os.path.join(root, "**", "estimates.json")
              for path in sorted(glob.glob(pattern, recursive=True)):
                  # Strip leading root/ and trailing /new/estimates.json
                  rel = os.path.relpath(path, root)
                  parts = rel.replace("\\", "/").split("/")
                  # Criterion layout: <name…>/new/estimates.json
                  if len(parts) >= 2 and parts[-2] == "new":
                      name = "/".join(parts[:-2])
                  else:
                      continue
                  with open(path) as f:
                      data = json.load(f)
                  mean = data.get("mean", {}).get("point_estimate")
                  if mean is not None:
                      results[name] = mean
              return results

          def fmt_time(ns):
              if ns >= 1e9:
                  return f"{ns / 1e9:.3f} s"
              if ns >= 1e6:
                  return f"{ns / 1e6:.3f} ms"
              if ns >= 1e3:
                  return f"{ns / 1e3:.3f} µs"
              return f"{ns:.1f} ns"

          base = load_estimates("bench-base")
          pr   = load_estimates("bench-pr")
          all_names = sorted(set(base) | set(pr))

          rows = []
          for name in all_names:
              b = base.get(name)
              p = pr.get(name)
              if b is not None and p is not None:
                  pct = (p - b) / b * 100
                  icon = "🔴" if pct > THRESHOLD_PCT else ("🟢" if pct < -THRESHOLD_PCT else "⚪")
                  rows.append(f"| `{name}` | {fmt_time(b)} | {fmt_time(p)} | {pct:+.1f}% {icon} |")
              elif b is not None:
                  rows.append(f"| `{name}` | {fmt_time(b)} | _(removed)_ | — |")
              else:
                  rows.append(f"| `{name}` | _(new)_ | {fmt_time(p)} | — |")

          table = (
              "| Benchmark | Base | PR | Change |\n"
              "|:----------|-----:|---:|-------:|\n"
          ) + "\n".join(rows)

          legend = f"> 🟢 improvement (≥ {THRESHOLD_PCT}% faster)  ·  ⚪ neutral  ·  🔴 regression (≥ {THRESHOLD_PCT}% slower)"

          report = f"<!-- benchmark-report -->\n## Benchmark Results\n\n{table}\n\n{legend}\n"

          # Write to the job summary
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise RuntimeError("GITHUB_STEP_SUMMARY is not set; this script must run inside GitHub Actions")
          with open(summary_path, "a") as f:
              f.write(report)

          # Write to a file for the comment step
          with open("bench_comment.md", "w") as f:
              f.write(report)

          print("Report written.")
          PYEOF

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('bench_comment.md', 'utf8');
            const marker = '<!-- benchmark-report -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
