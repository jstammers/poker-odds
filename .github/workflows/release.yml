name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Build WASM on Linux where wasm-opt works correctly.
  # Release builds intentionally skip the output-cache fast path — every
  # release rebuilds from clean for provenance. Compile caching via
  # Swatinem/rust-cache still applies.
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build WASM module
        run: wasm-pack build --target bundler --out-dir web/wasm --release

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: web/wasm/
          retention-days: 7

  # Build Tauri bundles per-platform. The matrix mirrors ci.yml; additional
  # targets (Linux, Windows, mobile) land here once their CI rows are green.
  build-tauri:
    name: Build Tauri (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [build-wasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-path: target/universal-apple-darwin/release/bundle
            args: --target universal-apple-darwin
          # - name: linux-x86_64
          #   os: ubuntu-22.04
          #   rust-targets: x86_64-unknown-linux-gnu
          #   bundle-path: target/release/bundle
          #   args: ''
          # - name: windows-x86_64
          #   os: windows-latest
          #   rust-targets: x86_64-pc-windows-msvc
          #   bundle-path: target/release/bundle
          #   args: ''
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: tauri-release-${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: web/wasm/

      - name: Install JS dependencies
        run: cd web && npm ci

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: web
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.name }}
          path: ${{ matrix.bundle-path }}/
          retention-days: 7

  # Generate the changelog once, after all platform bundles are built.
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: [build-tauri]
    outputs:
      body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip-header

  # Collect bundles, emit SHA-256 sidecars uniformly, publish the Release.
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-tauri, changelog]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-bundle-*
          path: bundles/
          merge-multiple: false

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist

          # macOS universal DMG
          MAC_DMG=$(find bundles/tauri-bundle-macos-universal -name '*.dmg' | head -1 || true)
          if [ -n "${MAC_DMG:-}" ]; then
            cp "$MAC_DMG" dist/poker-odds-macos-universal.dmg
          fi

          # (Future) Linux .deb / .AppImage — enable alongside matrix row
          # LINUX_DEB=$(find bundles/tauri-bundle-linux-x86_64 -name '*.deb' | head -1 || true)
          # [ -n "${LINUX_DEB:-}" ] && cp "$LINUX_DEB" dist/poker-odds-linux-x86_64.deb
          # LINUX_APPIMAGE=$(find bundles/tauri-bundle-linux-x86_64 -name '*.AppImage' | head -1 || true)
          # [ -n "${LINUX_APPIMAGE:-}" ] && cp "$LINUX_APPIMAGE" dist/poker-odds-linux-x86_64.AppImage

          # (Future) Windows .msi
          # WIN_MSI=$(find bundles/tauri-bundle-windows-x86_64 -name '*.msi' | head -1 || true)
          # [ -n "${WIN_MSI:-}" ] && cp "$WIN_MSI" dist/poker-odds-windows-x86_64.msi

          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "Error: no release assets collected"
            exit 1
          fi

          # Uniform SHA-256 sidecars across all bundles
          cd dist
          for f in *; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.changelog.outputs.body }}
          files: |
            dist/*
