name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build universal macOS app
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM module
        run: wasm-pack build --target bundler --out-dir web/wasm --release

      - name: Install npm dependencies
        working-directory: web
        run: npm ci

      - name: Build Tauri universal app
        working-directory: web
        run: npx tauri build --target universal-apple-darwin

      - name: Package DMG
        run: |
          mkdir -p dist
          DMG=$(find web/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          cp "$DMG" dist/poker-odds-macos-universal.dmg
          shasum -a 256 dist/poker-odds-macos-universal.dmg > dist/poker-odds-macos-universal.dmg.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/poker-odds-macos-universal.dmg
            dist/poker-odds-macos-universal.dmg.sha256
